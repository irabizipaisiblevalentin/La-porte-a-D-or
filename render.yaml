# Render blueprint — https://render.com/docs/blueprint-spec
#
# The production service already exists on Render, so this file is a REFERENCE:
# set the same values in the Render dashboard (Environment + Build & Deploy).
# If the service is ever rebuilt from scratch: New + → Blueprint → this repo.
#
# Security: this repository is PUBLIC. Secrets are therefore never stored here —
# they are marked `sync: false` and must be entered in the Render dashboard.
services:
  - type: web
    name: la-porte-ador
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: sh deploy/render-start.sh
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Opt-in bootstrapping of the four administrator accounts. It only CREATES
      # accounts that don't exist yet and never modifies existing ones. Once all
      # four accounts exist you may remove this variable.
      - key: ALLOW_DEFAULT_ACCOUNTS
        value: "1"
      # Cookies are only sent over https (Render terminates TLS in front).
      - key: SESSION_COOKIE_SECURE
        value: "true"
      # Optional. With "1", deploy/render-start.sh REFUSES to start when the
      # database could not be restored from the bucket (the free plan's disk is
      # wiped on every restart), instead of quietly serving an empty database.
      # Leave at "0"/unset to start anyway, loudly flagged on /api/health.
      # - key: REQUIRE_RESTORE
      #   value: "1"
      # --- Secrets: enter these values in the Render dashboard, not here -----
      #   APP_SECRET              (stable random string; never rotate casually)
      #   CHAIRMAN_PASSWORD       SENIOR_ADMIN_PASSWORD
      #   JUNIOR_ADMIN_PASSWORD   MEMBERS_ADMIN_PASSWORD
      # --- Durable storage (Backblaze B2 bucket; see docs/DEPLOYMENT.md) ----
      #   S3_BUCKET  S3_ENDPOINT  S3_REGION  S3_ACCESS_KEY_ID  S3_SECRET_ACCESS_KEY
      - key: APP_SECRET
        sync: false
      - key: CHAIRMAN_PASSWORD
        sync: false
      - key: SENIOR_ADMIN_PASSWORD
        sync: false
      - key: JUNIOR_ADMIN_PASSWORD
        sync: false
      - key: MEMBERS_ADMIN_PASSWORD
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
